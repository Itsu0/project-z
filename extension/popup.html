<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus PTT</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0a0a;
      color: #e2e8f0;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 0.5px solid rgba(255,255,255,0.08);
    }

    .logo {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #dc2626, #f59e0b);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 16px; color: white;
      flex-shrink: 0;
    }

    .header-text h1 { font-size: 14px; font-weight: 700; color: #f8fafc; }
    .header-text p  { font-size: 11px; color: #64748b; margin-top: 1px; }

    /* Status karta Nexus */
    .nexus-status {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; border-radius: 10px;
      margin-bottom: 12px; font-size: 12px;
    }
    .nexus-status.found    { background: rgba(34,197,94,0.1);  border: 0.5px solid rgba(34,197,94,0.25);  color: #4ade80; }
    .nexus-status.notfound { background: rgba(239,68,68,0.1);  border: 0.5px solid rgba(239,68,68,0.25);  color: #f87171; }

    .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .dot.green { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
    .dot.red   { background: #ef4444; }

    /* PTT przycisk */
    .ptt-btn {
      width: 100%; padding: 14px;
      border-radius: 12px; border: none; cursor: pointer;
      font-size: 14px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.15s ease; margin-bottom: 12px;
      letter-spacing: 0.02em;
    }
    .ptt-btn.inactive {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #94a3b8;
    }
    .ptt-btn.inactive:hover { background: rgba(255,255,255,0.1); color: #e2e8f0; }
    .ptt-btn.active {
      background: linear-gradient(135deg, #dc2626, #f59e0b);
      color: white;
      box-shadow: 0 0 20px rgba(220,38,38,0.4);
      animation: pulse-glow 1.5s ease infinite;
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 16px rgba(220,38,38,0.4); }
      50%       { box-shadow: 0 0 28px rgba(220,38,38,0.7); }
    }

    /* Skrót */
    .shortcut-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; border-radius: 10px;
      background: rgba(255,255,255,0.03);
      border: 0.5px solid rgba(255,255,255,0.07);
      margin-bottom: 8px;
    }
    .shortcut-label { font-size: 11px; color: #64748b; }
    .shortcut-key {
      font-size: 11px; font-weight: 700; font-family: monospace;
      background: rgba(255,255,255,0.08);
      padding: 3px 8px; border-radius: 6px; color: #a78bfa;
      border: 0.5px solid rgba(167,139,250,0.3);
    }

    /* Linki */
    .links { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
    .link-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 10px; border-radius: 8px;
      font-size: 11px; color: #64748b; text-decoration: none;
      cursor: pointer; background: none; border: none; width: 100%; text-align: left;
      transition: color 0.1s, background 0.1s;
    }
    .link-btn:hover { color: #e2e8f0; background: rgba(255,255,255,0.05); }

    .hint {
      font-size: 10px; color: #475569; text-align: center;
      margin-top: 10px; line-height: 1.5;
      padding: 8px; border-radius: 8px;
      background: rgba(255,255,255,0.02);
    }
    .hint strong { color: #f59e0b; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">N</div>
    <div class="header-text">
      <h1>Nexus PTT</h1>
      <p>Globalny Push-to-Talk</p>
    </div>
  </div>

  <div id="nexusStatus" class="nexus-status notfound">
    <div class="dot red" id="statusDot"></div>
    <span id="statusText">Szukam karty Nexus…</span>
  </div>

  <button id="pttBtn" class="ptt-btn inactive">
    <span id="pttIcon">🎙</span>
    <span id="pttLabel">Kliknij aby mówić</span>
  </button>

  <div class="shortcut-row">
    <span class="shortcut-label">Globalny skrót</span>
    <span class="shortcut-key" id="shortcutKey">Alt+Shift+P</span>
  </div>

  <div class="links">
    <button class="link-btn" id="btnShortcuts">
      ⌨️ Zmień skrót klawiszowy
    </button>
    <button class="link-btn" id="btnNexus">
      🔗 Otwórz aplikację Nexus
    </button>
  </div>

  <div class="hint">
    <strong>Tryb Toggle</strong> — wciśnij skrót raz aby otworzyć mikrofon,<br>
    wciśnij ponownie aby zamknąć. Działa w grach.
  </div>

  <script src="popup.js"></script>
</body>
</html>
